services:
  backend:
    build: .
    command: sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "scripts/wait_for_backend.py", "--url", "http://127.0.0.1:8000/api/health", "--timeout", "10"]
      interval: 10s
      timeout: 12s
      retries: 12
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build: .
    command: sh -c "alembic upgrade head && python scripts/wait_for_backend.py --url http://backend:8000/api/health --timeout 180 && python -m backend.app.workers.scheduler"
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruit_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruit} -d ${POSTGRES_DB:-recruitment}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: sh -c 'redis-server --appendonly yes --save 60 1000 --requirepass "$${REDIS_PASSWORD:-recruit_redis_dev_password}"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-recruit_redis_dev_password}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-recruit_redis_dev_password}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama:
